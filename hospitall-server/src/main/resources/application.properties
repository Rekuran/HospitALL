spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/hospitaldb?useSSL=false&allowPublicKeyRetrieval=true&disableSspi=true}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2005}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
